<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
  <title>USC IT Idea Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>USC Division of IT — Idea Portal</h1>
    <div>
      <button id="changeDisplayNameBtn" style="display: none; margin-right: 10px;">Change Display Name</button>
      <button id="loginBtn">Login / Sign Up</button>
    </div>
  </header>

  <section id="postIdea">
    <h2>Share Your Idea</h2>
    <textarea id="ideaText" placeholder="Share your idea..."></textarea>
    <button id="submitIdea">Post Idea</button>
  </section>

  <section id="ideasList"></section>

  <!-- Auth Modal -->
  <div id="authModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: white; padding: 30px; border-radius: 8px; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto;">
      <button id="closeModal" style="float: right; background: none; border: none; font-size: 24px; cursor: pointer; padding: 0; margin: 0;">&times;</button>
      
      <div style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; margin-top: 10px;">
        <button id="signupTab" class="auth-tab active" style="flex: 1;">Sign Up</button>
        <button id="loginTab" class="auth-tab" style="flex: 1;">Log In</button>
      </div>

      <!-- Signup Form -->
      <div id="signupForm">
        <h2>Create Account</h2>
        <input id="signupDisplayName" type="text" placeholder="Display Name" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        <input id="signupEmail" type="email" placeholder="Email" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        <input id="signupPassword" type="password" placeholder="Password" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        <input id="signupConfirmPassword" type="password" placeholder="Confirm Password" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        <button id="signupBtn" style="width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 0;">Sign Up</button>
        
        <div style="margin-top: 20px; text-align: center;">
          <p style="color: #666;">Or sign in with:</p>
          <button id="googleLoginBtn" style="width: 100%; padding: 10px; margin: 10px 0; background: white; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
          </button>
        </div>
      </div>

      <!-- Login Form -->
      <div id="loginForm" style="display: none;">
        <h2>Log In</h2>
        <input id="loginEmail" type="email" placeholder="Email" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        <input id="loginPassword" type="password" placeholder="Password" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        <button id="loginSubmitBtn" style="width: 100%; padding: 10px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 0;">Log In</button>
        
        <div style="margin-top: 20px; text-align: center;">
          <p style="color: #666;">Or sign in with:</p>
          <button id="googleLoginBtn2" style="width: 100%; padding: 10px; margin: 10px 0; background: white; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Idea Modal -->
  <div id="editIdeaModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1001;">
    <div style="background: white; padding: 30px; border-radius: 8px; width: 90%; max-width: 400px;">
      <button id="closeEditModal" style="float: right; background: none; border: none; font-size: 24px; cursor: pointer; padding: 0; margin: 0;">&times;</button>
      <h2 style="margin-top: 0;">Edit Idea</h2>
      <textarea id="editIdeaText" style="width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: Arial, sans-serif; resize: vertical;"></textarea>
      <button id="saveEditBtn" style="width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px;">Save Changes</button>
    </div>
  </div>

  <!-- Display Name Modal -->
  <div id="displayNameModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1001;">
    <div style="background: white; padding: 30px; border-radius: 8px; width: 90%; max-width: 400px;">
      <button id="closeDisplayNameModal" style="float: right; background: none; border: none; font-size: 24px; cursor: pointer; padding: 0; margin: 0;">&times;</button>
      <h2 style="margin-top: 0;">Set Display Name</h2>
      <p>Choose a display name for your ideas:</p>
      <input id="displayNameInput" type="text" placeholder="Your display name" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px;">
      <button id="saveDisplayNameBtn" style="width: 100%; padding: 10px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px;">Save Display Name</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
